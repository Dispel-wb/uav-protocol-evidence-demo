<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760"><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif}</style><rect width="1600" height="760" fill="#FFFFFF"/><text x="72" y="65" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">观察到的断点</text><text x="540" y="65" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">研究动作</text><text x="1104" y="65" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">验收证据</text><path d="M72 91 H1530" fill="none" stroke="#23292F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="72" y="154" text-anchor="start" fill="#004488" font-size="26" font-weight="700">01</text><text x="125" y="154" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">版本漂移</text><text x="125" y="197" text-anchor="start" fill="#5B6268" font-size="24" font-weight="400">同一消息在不同版本中变长</text><text x="540" y="170" text-anchor="start" fill="#29353B" font-size="27" font-weight="400">开放集拒识 → 人工核验版本</text><text x="1104" y="170" text-anchor="start" fill="#29353B" font-size="26" font-weight="400">跨版本留出集；未知版本拒识率</text><path d="M485 165 H521" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M510 158 L521 165 L510 172" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 165 H1080" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1069 158 L1080 165 L1069 172" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M72 230 H1530" fill="none" stroke="#AAB1B5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="72" y="293" text-anchor="start" fill="#004488" font-size="26" font-weight="700">02</text><text x="125" y="293" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">字段语义</text><text x="125" y="336" text-anchor="start" fill="#5B6268" font-size="24" font-weight="400">字节边界已知，含义仍不确定</text><text x="540" y="309" text-anchor="start" fill="#29353B" font-size="27" font-weight="400">动作日志与报文联动推断</text><text x="1104" y="309" text-anchor="start" fill="#29353B" font-size="26" font-weight="400">字段来源、置信度、冲突记录</text><path d="M485 304 H521" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M510 297 L521 304 L510 311" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 304 H1080" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1069 297 L1080 304 L1069 311" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M72 369 H1530" fill="none" stroke="#AAB1B5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="72" y="432" text-anchor="start" fill="#004488" font-size="26" font-weight="700">03</text><text x="125" y="432" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">交互状态</text><text x="125" y="475" text-anchor="start" fill="#5B6268" font-size="24" font-weight="400">单帧合法，顺序仍可能违规</text><text x="540" y="448" text-anchor="start" fill="#29353B" font-size="27" font-weight="400">守卫条件与在线状态跟踪</text><text x="1104" y="448" text-anchor="start" fill="#29353B" font-size="26" font-weight="400">ARM→TAKEOFF 序列回放结果</text><path d="M485 443 H521" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M510 436 L521 443 L510 450" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 443 H1080" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1069 436 L1080 443 L1069 450" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M72 508 H1530" fill="none" stroke="#AAB1B5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="72" y="571" text-anchor="start" fill="#004488" font-size="26" font-weight="700">04</text><text x="125" y="571" text-anchor="start" fill="#29353B" font-size="29" font-weight="700">结论复核</text><text x="125" y="614" text-anchor="start" fill="#5B6268" font-size="24" font-weight="400">异常报告难定位到原始样本</text><text x="540" y="587" text-anchor="start" fill="#29353B" font-size="27" font-weight="400">证据索引 + 失败样本回归</text><text x="1104" y="587" text-anchor="start" fill="#29353B" font-size="26" font-weight="400">消息号、前后状态、版本、用例</text><path d="M485 582 H521" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M510 575 L521 582 L510 589" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1032 582 H1080" fill="none" stroke="#AAB1B5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1069 575 L1080 582 L1069 589" fill="none" stroke="#AAB1B5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M72 647 H1530" fill="none" stroke="#AAB1B5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><text x="72" y="723" text-anchor="start" fill="#5B6268" font-size="25" font-weight="400">每个输出都能回溯到样本、版本和实验动作；不能确认的字段保留候选状态。</text></svg>