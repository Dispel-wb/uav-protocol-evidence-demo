  <style>
    text { font-family: 'Microsoft YaHei','Noto Sans SC','PingFang SC',Arial,sans-serif; fill:#273142; }
    .title { font-size:28px; font-weight:700; fill:#244A7C; }
    .subtitle { font-size:14px; fill:#667085; }
    .head { font-size:18px; font-weight:700; }
    .label { font-size:15px; font-weight:700; }
    .body { font-size:13px; }
    .small { font-size:12px; fill:#667085; }
  </style>
</defs>
<rect x="0" y="0" width="1600" height="820" fill="#FFFFFF"/>
<rect x="24" y="22" width="7" height="48" rx="3" fill="#244A7C"/>
