<svg viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 z" fill="#516B91"/></marker>
